name: Build echo-grpc

on:
  push:
    branches: [main]
    paths:
      - "echo-grpc/**"
      - "flake.*"
      - ".github/workflows/build.echo-grpc.yml"
  pull_request:
    branches: [main]
    paths:
      - "echo-grpc/**"
      - "flake.*"
      - ".github/workflows/build.echo-grpc.yml"

# A pull request only needs its latest commit checked. A run on main waits for
# the one before it instead of cancelling it.
concurrency:
  group: build-echo-grpc-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@v35
      # Load the development shell (flake.nix) into the job, so the steps
      # below run the same commands as local development.
      - uses: nicknovitski/nix-develop@v1
      # The same gate as local development (echo-grpc/justfile).
      - run: just echo-grpc::ci
